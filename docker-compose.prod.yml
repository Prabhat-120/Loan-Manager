version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: loan_mongodb_prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: loan-manager
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan_backend_prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/loan-manager
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loan_frontend_prod
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongodb_prod_data:
