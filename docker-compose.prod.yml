version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: loan_mongodb_prod
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: loan-manager
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan_backend_prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/loan-manager?replicaSet=rs0
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loan_frontend_prod
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongodb_prod_data:
